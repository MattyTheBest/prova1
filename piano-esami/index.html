<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Master Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app a pannelli. Su iPad e Mac barra laterale fissa + area contenuti a griglia di schede;
   su telefono barra in alto e schede in basso. Solo tema chiaro: carta fredda, inchiostro scuro,
   un colore per ogni area della vita (studio indaco, Giappone vermiglio, Copenaghen blu mare). */
:root{
  --paper:#f4f5f7;
  --card:#ffffff;
  --side:#fbfbfc;
  --ink:#171a20;
  --ink2:#454b57;
  --mut:#7a808c;
  --line:#e2e5ea;
  --line2:#eff1f4;
  --study:#3a49c4; --study-soft:#eceefc;
  --jp:#c4432c;    --jp-soft:#fcece8;
  --cph:#1e6a87;   --cph-soft:#e4f1f6;
  --ok:#2d7a4f;    --ok-soft:#e5f3eb;
  --warn:#a86400;  --warn-soft:#fcf1dd;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-inline:0;padding-block:0}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--study);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums lining-nums}

/* Struttura */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.side{display:none}
.main{padding-inline:16px;padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));min-width:0}
.inner{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.mtop{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.mtop b{font-family:var(--serif);font-weight:500;font-size:20px}
.mtop span{font-size:13px;color:var(--mut)}
@media (min-width:880px){
  .app{grid-template-columns:252px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh;padding:30px 18px 24px;background:var(--side);border-right:1px solid var(--line);overflow-y:auto}
  .main{padding-inline:40px;padding-block:36px 64px}
  .mtop,.tabs{display:none!important}
}
.brand{font-family:var(--serif);font-size:26px;line-height:1.05;font-weight:500;padding-inline:10px}
.brand small{display:block;font-family:var(--sans);font-size:13px;color:var(--mut);margin-top:8px;line-height:1.4}
.snav{display:flex;flex-direction:column;gap:2px}
.snav button{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:10px;padding:10px 12px;text-align:left;font-size:15px;font-weight:500;color:var(--ink2)}
.snav button:hover{background:var(--line2)}
.snav button[aria-current="page"]{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(23,26,32,.05)}
.snav button span{flex:1}
.snav button em{font-style:normal;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink2));flex:none}
.side-foot{margin-top:auto;padding:16px 12px 0;border-top:1px solid var(--line)}
.side-foot p{font-size:12.5px;color:var(--mut)}
.side-foot b{display:block;font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.1;margin-top:2px;color:var(--ink)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(251,251,252,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;max-width:640px;margin:0 auto}
.tabs button{background:none;border:0;border-radius:10px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--mut);min-width:0}
.tabs button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabs button[aria-current="page"]{color:var(--ink);background:var(--line2)}

/* Intestazione di pagina */
.ph{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c,var(--mut))}
.ph h1{font-family:var(--serif);font-weight:500;font-size:clamp(34px,6vw,50px);line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
.ph p{color:var(--ink2);max-width:62ch;font-size:16px}

/* Griglie e schede */
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:700px){.g2{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:760px){.g3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.span2{grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0;box-shadow:0 1px 2px rgba(23,26,32,.04);display:flex;flex-direction:column;gap:14px}
.card.tint{background:var(--soft);border-color:transparent;box-shadow:none}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.card h2{font-family:var(--serif);font-weight:500;font-size:22px;line-height:1.2;text-wrap:balance}
.label{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.link{background:none;border:0;padding:0;font-size:13.5px;font-weight:600;color:var(--c,var(--study));white-space:nowrap}
.link:hover{text-decoration:underline}
.big{font-family:var(--serif);font-weight:500;font-size:clamp(38px,5vw,48px);line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums lining-nums}
.big small{font-size:.5em;margin-left:4px;color:var(--ink2)}
.mid{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums lining-nums}
.sub{font-size:14px;color:var(--ink2)}
.muted{color:var(--mut)}
.small{font-size:13.5px}
.bar{height:8px;border-radius:99px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--ink));transition:width .6s cubic-bezier(.4,0,.2,1)}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:11px 0;border-top:1px solid var(--line2)}
.row:first-child{border-top:0;padding-top:0}
.row > span:first-child{color:var(--ink2);min-width:0}
.row b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row b small{font-weight:500;color:var(--mut);margin-left:6px}
.note{padding:12px 14px;border-radius:12px;background:var(--line2);font-size:14px;color:var(--ink2)}
.note b{color:var(--ink);font-weight:600}
.note.warn{background:var(--warn-soft);color:#6e4300}
.note.warn b{color:#5a3700}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--line2);color:var(--ink2);white-space:nowrap}
.pill.c{background:var(--soft);color:var(--c)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

/* Controlli */
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 15px;font-size:14px;font-weight:600;white-space:nowrap;min-height:42px}
.btn:hover{border-color:#c9cdd5}
.btn.solid{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:#fff}
.btn.solid:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inp{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;min-height:42px;min-width:0}
.inp:focus{border-color:var(--c,var(--study));outline:0;box-shadow:0 0 0 3px var(--soft,var(--study-soft))}
.ctrl .inp{flex:1 1 120px;max-width:200px}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line2);cursor:pointer}
.check:first-of-type{border-top:0}
.check input{width:19px;height:19px;margin:2px 0 0;accent-color:var(--c,var(--study));flex:none}
.check.done span{color:var(--mut);text-decoration:line-through}
.seg{display:inline-flex;background:var(--line2);border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:9px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(23,26,32,.08)}

/* Ricevuta */
.rc{display:flex;flex-direction:column}
.rc .ln{display:flex;align-items:baseline;gap:10px;padding:7px 0}
.rc .ln i{flex:1;border-bottom:1px dotted #c3c7cf;transform:translateY(-4px);min-width:12px}
.rc .nt{font-size:12.5px;color:var(--mut);margin:-4px 0 4px}
.rc .sum{border-top:1px solid var(--line);margin-top:6px;padding-top:11px;font-weight:600}
.rc .neg{color:var(--jp)}
.rc input{width:5.2rem;text-align:right;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-variant-numeric:tabular-nums}
.rc input:focus{outline:0;border-color:var(--jp);box-shadow:0 0 0 3px var(--jp-soft)}

/* Itinerario */
.route{display:flex;flex-direction:column}
.stop{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;padding:0 0 16px}
.stop .rail{position:relative;display:flex;justify-content:center}
.stop .rail::before{content:"";position:absolute;top:18px;bottom:-4px;width:2px;background:var(--line)}
.stop:last-child .rail::before{display:none}
.stop .rail b{width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--jp);margin-top:7px;position:relative}
.stop h3{font-family:var(--serif);font-weight:500;font-size:23px;line-height:1.2;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.stop h3 span{font-family:var(--sans);font-size:13px;color:var(--mut);font-weight:500}
.stop p{font-size:14px;color:var(--ink2)}

/* Grafico */
.chart{position:relative;margin:0}
.chart svg{width:100%;height:auto;display:block;touch-action:pan-y;overflow:visible}
.chart .gl{stroke:var(--line2)}
.chart .ax{fill:var(--mut);font-size:11px;font-family:var(--sans)}
.chart .tg{stroke:#b9bec8;stroke-dasharray:3 5}
.chart .tl{fill:var(--ink2);font-size:11px;font-weight:600;font-family:var(--sans)}
.chart .hv{stroke:var(--ink2);stroke-width:1}
.tip{position:absolute;top:0;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);box-shadow:0 6px 18px rgba(23,26,32,.1);border-radius:10px;padding:8px 11px;font-size:12.5px;pointer-events:none;white-space:nowrap;z-index:2}
.tip b{font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}

/* Righello abbonamenti */
.ruler{position:relative;height:46px;margin:6px 8px 0}
.ruler .axis{position:absolute;left:0;right:0;top:26px;height:2px;background:var(--line);border-radius:2px}
.ruler .mk{position:absolute;top:21px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--card);border:2px solid var(--ink2)}
.ruler .mk.next{border-color:var(--study);background:var(--study)}
.ruler .mk span{position:absolute;top:-21px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--ink2)}
.ruler .td{position:absolute;top:12px;width:2px;height:30px;background:var(--jp);margin-left:-1px;border-radius:2px}
.ruler .td span{position:absolute;top:31px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:700;color:var(--jp);text-transform:uppercase;letter-spacing:.06em}
.split{display:flex;gap:3px;height:10px;border-radius:99px;overflow:hidden}
.split i{display:block;height:100%}

/* Tabella */
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
.tbl{width:100%;border-collapse:collapse;min-width:520px;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);padding:0 12px 10px 4px}
.tbl td{padding:11px 12px 11px 4px;border-top:1px solid var(--line2);font-variant-numeric:tabular-nums}
.tbl td:first-child{font-weight:600}

/* Tappe */
.ev{display:grid;grid-template-columns:minmax(0,1fr);gap:2px 22px;padding:14px 0;border-top:1px solid var(--line2)}
.ev:first-child{border-top:0;padding-top:0}
@media (min-width:720px){.ev{grid-template-columns:11rem minmax(0,1fr)}}
.ev .when{font-size:13px;font-weight:600;color:var(--mut);padding-top:3px}
.ev.key .when{color:var(--c,var(--jp))}
.ev h3{font-family:var(--serif);font-weight:500;font-size:20px;line-height:1.25}
.ev p{font-size:14px;color:var(--ink2);max-width:62ch}

/* Studio */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.strip button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;min-width:0}
.strip button:hover{border-color:#c9cdd5}
.strip .m{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.strip .n{display:block;font-family:var(--serif);font-size:28px;line-height:1.15;font-weight:500}
.strip .c{font-size:12px;color:var(--mut)}
.strip button.next{border-color:var(--study);box-shadow:0 0 0 1px var(--study)}
.strip button.next .m{color:var(--study)}
.course h3{font-family:var(--serif);font-weight:500;font-size:20px;line-height:1.25;text-wrap:balance;min-width:0}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 16px;margin:0;font-size:14px}
.facts dt{color:var(--mut)}
.facts dd{margin:0;font-variant-numeric:tabular-nums}
.facts dd strong{font-weight:600}
.sess{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.sess button{border:1px solid var(--line);background:var(--card);border-radius:10px;min-height:46px;padding:6px 4px;font-weight:600;font-size:14px;line-height:1.15}
.sess button small{display:block;font-weight:500;font-size:11px;color:var(--mut)}
.sess button:hover:not(:disabled){border-color:#c9cdd5}
.sess button[aria-pressed="true"]{background:var(--study);border-color:var(--study);color:#fff}
.sess button[aria-pressed="true"] small{color:rgba(255,255,255,.8)}
.sess button:disabled{opacity:.35;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--ink2)}
.chip:hover{border-color:#c9cdd5;color:var(--ink)}
.chip.on{background:var(--study-soft);border-color:transparent;color:var(--study)}
details{font-size:13.5px;color:var(--ink2)}
details summary{cursor:pointer;color:var(--study);font-weight:600}
details ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line2)}
.srow:first-child{border-top:0;padding-top:0}
.srow strong{display:block;font-weight:600;line-height:1.3}
.srow span.s{font-size:13px;color:var(--mut)}
.done-list{display:flex;flex-direction:column}
.done-list div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line2);font-size:14.5px;color:var(--ink2)}
.done-list div:first-child{border-top:0}
.week{padding:12px 0;border-top:1px solid var(--line2)}
.week:first-child{border-top:0;padding-top:0}
.week.now{background:var(--study-soft);margin-inline:-12px;padding:12px;border-radius:12px;border-top-color:transparent}
.week-h{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:6px}
.week-h b{font-family:var(--serif);font-weight:500;font-size:18px}
.week-h span{font-size:12.5px;color:var(--mut)}
.week.now .week-h span{color:var(--study);font-weight:600}
.les{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;font-size:14px;padding:3px 0}
.les .d{font-size:12.5px;color:var(--mut);padding-top:1px}
.les .n small{display:block;color:var(--mut);font-size:12.5px}
.les.clash .n{color:var(--warn)}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:8px}
.sec-title h2{font-family:var(--serif);font-weight:500;font-size:26px}
.sec-title span{font-size:13px;color:var(--mut)}
.arm{border-color:var(--warn)!important;color:var(--warn)!important}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script>
'use strict';
const { useState, useEffect, useRef } = React;
const html = htm.bind(React.createElement);

/* ================= Utilità ================= */
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const toDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const nextFri = d => addDays(d, (5 - d.getDay() + 7) % 7);
const monthDate = m => { const p = m.split('-').map(Number); return new Date(p[0], p[1] - 1, 15); };
const fmtDate = (d, o) => d.toLocaleDateString('it-IT', o || { day: 'numeric', month: 'short', year: 'numeric' });
const plain = (n, dec) => n.toLocaleString('it-IT', { useGrouping: 'always', minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 });
const eur = (n, dec) => plain(n, dec) + ' €';
const pct = (v, t) => Math.min(100, Math.max(0, v / t * 100));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const MON = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const fmtS = (dt, yr) => dt.getDate() + ' ' + MON[dt.getMonth()] + (yr ? ' ' + dt.getFullYear() : '');
const daysBetween = (a, b) => Math.round((startOfDay(b) - startOfDay(a)) / 864e5);
function usePersist(key, init) {
  const [v, setV] = useState(() => { let r = null; try { r = JSON.parse(localStorage.getItem(key)); } catch (e) {} return init(r); });
  useEffect(() => { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }, [key, v]);
  return [v, setV];
}

/* ================= Soldi: costanti del piano ================= */
const TARGET_J = 3940, TARGET_C = 5000, WEEKLY = 60, BORSA = 750;
const TRIP_END = new Date(2027, 7, 1);
const SIM_END = new Date(2028, 8, 30);
const CPH_JUL = new Date(2028, 6, 15), CPH_SEP = new Date(2028, 8, 1);
const DAYS_TRIP = 19, FOOD_DAY = 35;
const FIXED = [
  { k: 'Voli', v: 950, n: 'Intercontinentale 650–750 + Okinawa 150–250' },

function loadMoney(s) {
  const st = MONEY_DEFAULTS();

    st.japan = Math.min(TARGET_J, Math.max(0, num(s.japan, st.japan)));
    st.cph = Math.max(0, num(s.cph, st.cph));
    st.lastDeposit = typeof s.lastDeposit === 'string' ? s.lastDeposit : null;
    if (s.scen) {
      st.scen.b1 = !!s.scen.b1; st.scen.b2 = !!s.scen.b2;

}

/* Simulazione settimanale: ogni venerdì 60 €, prima al Giappone fino all'obiettivo, poi a Copenaghen.
   A fine luglio 2027 il fondo Giappone si spende nel viaggio. */
function simulate(sc, cur, lastDeposit) {
  const today = startOfDay(new Date());
  let j = cur.japan, c = cur.cph - (sc.iphone || 0);
  let first = nextFri(today);
  if (lastDeposit === iso(today) && iso(first) === iso(today)) first = addDays(first, 7);
  const lumps = [];
  if (sc.b1) lumps.push({ d: monthDate(sc.b1m), a: BORSA, done: false });
  if (sc.b2) lumps.push({ d: monthDate(sc.b2m), a: BORSA, done: false });
  const pts = [{ d: today, j, c, trip: false }];
  let trip = today >= TRIP_END, n = 0;
  if (trip) j = 0;
  let jDate = (!trip && j >= TARGET_J) ? today : null, jWeeks = jDate ? 0 : null;
  let cDate = c >= TARGET_C ? today : null;
  const add = a => { if (!trip) { const t = Math.max(0, Math.min(a, TARGET_J - j)); j += t; a -= t; } c += a; };
  for (let d = first; d <= SIM_END; d = addDays(d, 7)) {
    if (!trip && d >= TRIP_END) { trip = true; j = 0; }
    for (const l of lumps) { if (!l.done && l.d <= d) { add(l.a); l.done = true; } }
    add(WEEKLY); n++;
    if (jDate === null && !trip && j >= TARGET_J) { jDate = d; jWeeks = n; }
    if (cDate === null && c >= TARGET_C) cDate = d;
    pts.push({ d, j, c, trip });
  }
  return { pts, first, jDate, jWeeks, cDate,
    at(date) { let p = pts[0]; for (const q of pts) { if (q.d <= date) p = q; else break; } return p; } };
}
function nextSub(now) {
  let best = null;
  const dim = (y, m) => new Date(y, m + 1, 0).getDate();
  SUBS.forEach(s => {
    let d = new Date(now.getFullYear(), now.getMonth(), Math.min(s.day, dim(now.getFullYear(), now.getMonth())));
    if (d < now) d = new Date(now.getFullYear(), now.getMonth() + 1, Math.min(s.day, dim(now.getFullYear(), now.getMonth() + 1)));
    if (!best || d < best.d) best = { s, d };
  });
  return best;
}
const dateTxt = d => d ? (d <= startOfDay(new Date()) ? 'Raggiunto' : fmtDate(d)) : 'Dopo il viaggio';
function scenarioText(sc) {

  if (sc.iphone) parts.push('iPhone ' + eur(sc.iphone));
  return parts.length ? parts.join(' · ') : 'base, senza borsa e senza iPhone';
}

function span(c) {

    const l = addDays(toDate(WEEKS[Math.max(...s.w)][0]), WD[s.d].last);
    if (!first || f < first) first = f;

  return { first, last };

function weeksText(arr) {

  for (let i = 1; i <= a.length; i++) { if (a[i] === p + 1) { p = a[i]; continue; } out.push(s === p ? String(s) : s + '–' + p); s = a[i]; p = a[i]; }
  return out.join(', ');
}
function clashWeeks(a, b) {
  const hit = new Set();
  (a.slots || []).forEach(sa => (b.slots || []).forEach(sb => {
    if (sa.d !== sb.d) return;
    const [a1, a2] = trange(sa.t), [b1, b2] = trange(sb.t);
    if (a1 < b2 && b1 < a2) sa.w.forEach(w => { if (sb.w.includes(w)) hit.add(w); });

function examApi(E) {
  const isDone = c => c.done || !!E.passed[c.id];
  const attends = c => !!E.attend[c.id];
  const eligible = (c, s) => {
    if (isDone(c) || c.thesis) return false;
    if (!attends(c)) return true;
    if (c.sem2) return s.k === 'giu' || s.k === 'set';
    return span(c).last < toDate(s.start);
  };
  const earliest = c => SESS.find(s => eligible(c, s));
  const exams = () => COURSES.filter(c => !isDone(c) && !c.thesis);
  const nextSession = () => { const t = new Date(); return SESS.find(s => toDate(s.start) >= addDays(t, -20)) || SESS[SESS.length - 1]; };
  return { isDone, attends, eligible, earliest, exams, nextSession };
}
function weekOf(date) {
  for (const w of Object.keys(WEEKS).map(Number)) { const m = toDate(WEEKS[w][0]); if (date >= m && date < addDays(m, 7)) return w; }

}
function lessonsInWeek(E, w) {

}

function Chart({ sim, j, c, t1 }) {
  const [hv, setHv] = useState(null);

  if (c) { m = Math.max(m, TARGET_C); pts.forEach(p => { m = Math.max(m, p.c); }); }
  const ymax = Math.ceil(m * 1.04 / 1000) * 1000, step = ymax > 6000 ? 2000 : 1000;
  const X = t => pl + (t - T0) / (T1 - T0) * (W - pl - pr), Y = v => pt + (1 - v / ymax) * (H - pt - pb);
  const grid = []; for (let v = 0; v <= ymax; v += step) grid.push(v);
  const months = []; let d = new Date(sim.pts[0].d.getFullYear(), sim.pts[0].d.getMonth() + 1, 1);
  while (d.getTime() <= T1) { if (d.getMonth() % 3 === 0) months.push(new Date(d)); d = new Date(d.getFullYear(), d.getMonth() + 1, 1); }
  const line = (arr, key) => arr.map((p, i) => (i ? 'L' : 'M') + X(p.d.getTime()).toFixed(1) + ' ' + Y(p[key]).toFixed(1)).join('');
  const area = (arr, key) => arr.length ? line(arr, key) + 'L' + X(arr[arr.length - 1].d.getTime()).toFixed(1) + ' ' + Y(0) + 'L' + X(arr[0].d.getTime()).toFixed(1) + ' ' + Y(0) + 'Z' : '';
  const jp = pts.filter(p => !p.trip);
  const ref = useRef(null);
  const move = e => {
    const r = ref.current.getBoundingClientRect();
    const t = T0 + ((e.clientX - r.left) / r.width * W - pl) / (W - pl - pr) * (T1 - T0);
    let best = pts[0], bd = Infinity;
    for (const p of pts) { const dd = Math.abs(p.d.getTime() - t); if (dd < bd) { bd = dd; best = p; } }
    const px = X(best.d.getTime());
    setHv({ p: best, px, left: Math.min(Math.max(px / W * r.width, 80), r.width - 80) });
  };
  const tripX = X(TRIP_END.getTime());
  return html`
    <figure className="chart">
      ${hv ? html`<div className="tip" style=${{ left: hv.left + 'px' }}>
        <span className="muted">${fmtDate(hv.p.d)}</span>
        ${j && !hv.p.trip ? html`<br/>Giappone <b>${eur(hv.p.j)}</b>` : null}
        ${c ? html`<br/>Copenaghen <b>${eur(hv.p.c)}</b>` : null}
      </div>` : null}
      <svg ref=${ref} viewBox=${'0 0 ' + W + ' ' + H} role="img" aria-label="Andamento previsto dei fondi"
        onPointerMove=${move} onPointerDown=${move} onPointerLeave=${() => setHv(null)}>
        ${grid.map(v => html`<g key=${'g' + v}><line className="gl" x1=${pl} x2=${W - pr} y1=${Y(v)} y2=${Y(v)}/><text className="ax" x=${pl - 8} y=${Y(v) + 4} textAnchor="end">${v / 1000}k</text></g>`)}
        ${months.map(mm => html`<text key=${'m' + mm.getTime()} className="ax" x=${X(mm.getTime())} y=${H - 8} textAnchor="middle">${mm.toLocaleDateString('it-IT', { month: 'short', year: '2-digit' })}</text>`)}
        ${j ? html`<g><line className="tg" x1=${pl} x2=${W - pr} y1=${Y(TARGET_J)} y2=${Y(TARGET_J)}/><text className="tl" x=${pl + 6} y=${Y(TARGET_J) - 7}>Giappone ${plain(TARGET_J)} €</text></g>` : null}
        ${c ? html`<g><line className="tg" x1=${pl} x2=${W - pr} y1=${Y(TARGET_C)} y2=${Y(TARGET_C)}/><text className="tl" x=${W - pr - 2} y=${Y(TARGET_C) - 7} textAnchor="end">Copenaghen ${plain(TARGET_C)} €</text></g>` : null}
        ${TRIP_END.getTime() < T1 ? html`<g><line className="tg" x1=${tripX} x2=${tripX} y1=${pt} y2=${H - pb}/><text className="tl" x=${tripX - 6} y=${pt + 10} textAnchor="end">Viaggio</text></g>` : null}
        ${c ? html`<path d=${area(pts, 'c')} fill="var(--cph)" opacity="0.08"/>` : null}
        ${j ? html`<path d=${area(jp, 'j')} fill="var(--jp)" opacity="0.09"/>` : null}
        ${c ? html`<path d=${line(pts, 'c')} fill="none" stroke="var(--cph)" strokeWidth="2.5" strokeLinejoin="round"/>` : null}
        ${j ? html`<path d=${line(jp, 'j')} fill="none" stroke="var(--jp)" strokeWidth="2.5" strokeLinejoin="round"/>` : null}
        ${j && sim.jDate && sim.jDate.getTime() <= T1 ? html`<circle cx=${X(sim.jDate.getTime())} cy=${Y(TARGET_J)} r="5.5" fill="var(--jp)" stroke="#fff" strokeWidth="2"/>` : null}
        ${c && sim.cDate && sim.cDate.getTime() <= T1 ? html`<circle cx=${X(sim.cDate.getTime())} cy=${Y(TARGET_C)} r="5.5" fill="var(--cph)" stroke="#fff" strokeWidth="2"/>` : null}
        ${hv ? html`<line className="hv" x1=${hv.px} x2=${hv.px} y1=${pt} y2=${H - pb}/>` : null}

      <button className="btn" type="button" onClick=${() => apply(1)}>Aggiungi</button>
      <button className="btn" type="button" onClick=${() => apply(-1)}>Togli</button>
    </div>`;
}

function CourseCard({ c, E, setE }) {
  const api = examApi(E), sp = span(c), att = api.attends(c), ear = api.earliest(c);
  const setPlan = k => setE(e => { const plan = { ...e.plan }; if (plan[c.id] === k) delete plan[c.id]; else plan[c.id] = k; return { ...e, plan }; });
  const toggleAttend = () => setE(e => {
    const attend = { ...e.attend, [c.id]: !att }, plan = { ...e.plan };
    const ne = { ...e, attend };
    const cur = SESS.find(s => s.k === plan[c.id]);
    if (cur && !examApi(ne).eligible(c, cur)) delete plan[c.id];
    return { ...ne, plan };
  });
  const pass = () => setE(e => { const plan = { ...e.plan }; delete plan[c.id]; return { ...e, plan, passed: { ...e.passed, [c.id]: true } }; });
  const clashes = [];
  if (c.slots && att) COURSES.forEach(o => {
    if (o === c || api.isDone(o) || !o.slots) return;
    const w = clashWeeks(c, o); if (!w.length) return;
    clashes.push({ o, w, both: api.attends(o) });
  });
  const opts = c.thesis ? DSESS : SESS;
  return html`
    <article className="card course" id=${'c-' + c.id}>
      <div>
        ${c.y === 'S' ? html`<span className="pill c" style=${{ '--c': 'var(--study)', '--soft': 'var(--study-soft)', marginBottom: '8px' }}>A scelta · ${c.from}</span>` : null}
        <div className="card-h" style=${{ marginTop: c.y === 'S' ? '8px' : 0 }}><h3>${c.name}</h3><span className="pill">${c.cfa ? c.cfa + ' CFA' : 'CFA da definire'}</span></div>
        ${c.prof ? html`<p className="sub" style=${{ marginTop: '2px' }}>Prof. ${c.prof}</p>` : null}
      </div>
      <dl className="facts">
        ${c.thesis ? html`<dt>Sessioni</dt><dd>Diploma: giugno 2027, settembre 2027, dicembre 2027, febbraio 2028</dd>`
        : c.sem2 ? html`<dt>Lezioni</dt><dd>2° semestre, palinsesto non ancora uscito</dd><dt>Esame</dt><dd><strong>${att ? 'da giugno 2027' : 'da dicembre 2026'}</strong></dd>`
        : html`
          ${att ? html`<dt>Inizio</dt><dd><strong>${fmtS(sp.first, true)}</strong></dd><dt>Fine</dt><dd><strong>${fmtS(sp.last, true)}</strong></dd>`
                : html`<dt>Lezioni</dt><dd>${fmtS(sp.first)} → ${fmtS(sp.last, true)} (frequenza già fatta)</dd>`}
          <dt>Quando</dt><dd>${[...new Set(c.slots.map(s => WD[s.d].label))].join(' / ')}, ${[...new Set(c.slots.map(s => prettyT(s.t)))].join(' / ')}</dd>
          <dt>Esame</dt><dd><strong>${ear ? 'da ' + ear.label.toLowerCase() + ' ' + ear.year : '—'}</strong></dd>`}
      </dl>
      ${clashes.map(x => x.both
        ? html`<p className="note warn" key=${x.o.id}>Stesso orario di <b>${x.o.name}</b> nelle settimane ${weeksText(x.w)}.</p>`
        : html`<p className="small muted" key=${x.o.id}>Stesso orario di ${x.o.name} nelle settimane ${weeksText(x.w)}, se dovessi frequentarla.</p>`)}
      <div>
        <span className="label">${c.thesis ? 'Sessione di diploma' : "Sessione d'esame"}</span>
        <div className="sess" role="group" style=${{ marginTop: '8px' }}>
          ${opts.map(s => { const ok = c.thesis || api.eligible(c, s); return html`
            <button key=${s.k} type="button" aria-pressed=${String(E.plan[c.id] === s.k)} disabled=${!ok}
              title=${ok ? s.label + ' ' + s.year : 'Le lezioni non sono ancora finite'} onClick=${() => setPlan(s.k)}>${s.short}<small>${s.year}</small></button>`; })}
        </div>
      </div>
      <div className="chips">
        ${c.thesis ? null : html`<button type="button" className=${'chip' + (att ? ' on' : '')} aria-pressed=${String(att)} onClick=${toggleAttend}>${att ? "Frequento quest'anno" : 'Frequenza già fatta'}</button>`}
        <button type="button" className="chip" onClick=${pass}>Segna superato</button>
      </div>
      ${c.slots ? html`<details><summary>Orario completo</summary><ul>${c.slots.map((s, i) => html`<li key=${i}>Settimane ${weeksText(s.w)} · ${WD[s.d].label} ${prettyT(s.t)} · ${s.p}</li>`)}</ul></details>` : null}
    </article>`;
}

function Plan({ S, setS, resetAll }) {

/* ================= App ================= */
const NAV = [
  ['oggi', 'Oggi', 'var(--ink2)'], ['studio', 'Studio', 'var(--study)'], ['giappone', 'Giappone', 'var(--jp)'],
  ['copenaghen', 'Copenaghen', 'var(--cph)'], ['timeline', 'Timeline', '#8a6bbf'], ['piano', 'Piano', 'var(--ok)']
];
function App() {
  const [S, setS] = usePersist('masterDashboard.v2', loadMoney);
  const [E, setE] = usePersist('pianoEsami.mattia.v2', r => (r && r.plan && r.attend ? { tab: 'materie', passed: {}, ...r } : EXAM_DEFAULTS()));
  const [view, setView] = usePersist('masterDashboard.view', r => (NAV.some(n => n[0] === r) ? r : 'oggi'));
  const [, tick] = useState(0);
  useEffect(() => { const f = () => { if (!document.hidden) tick(x => x + 1); }; document.addEventListener('visibilitychange', f); return () => document.removeEventListener('visibilitychange', f); }, []);
  const sim = simulate(S.scen, { japan: S.japan, cph: S.cph }, S.lastDeposit);
  const r2 = n => Math.round(n * 100) / 100;
  const adjust = (fund, amt) => setS(s => {
    const before = fund === 'japan' ? s.japan : s.cph;
    const ns = { ...s };
    if (fund === 'japan') ns.japan = r2(Math.min(TARGET_J, Math.max(0, s.japan + amt))); else ns.cph = r2(Math.max(0, s.cph + amt));
    const after = fund === 'japan' ? ns.japan : ns.cph;
    if (amt > 0 && after > before) ns.lastDeposit = iso(startOfDay(new Date()));
    return ns;
  });
  const deposit = a => setS(s => {
    const today = startOfDay(new Date()), ns = { ...s };
    if (today < TRIP_END) { const t = Math.max(0, Math.min(a, TARGET_J - s.japan)); ns.japan = r2(s.japan + t); a -= t; }
    ns.cph = r2(s.cph + a); ns.lastDeposit = iso(today); return ns;
  });
  const go = (v, arg) => {
    if (v === '__check') { setS(s => ({ ...s, checks: { ...s.checks, [arg]: true } })); return; }
    setView(v); window.scrollTo(0, 0);
  };
  const resetAll = () => { setS(MONEY_DEFAULTS()); setE(EXAM_DEFAULTS()); };
  const now = new Date();
  let page;
  if (view === 'studio') page = html`<${Studio} E=${E} setE=${setE}/>`;
  else if (view === 'giappone') page = html`<${Japan} S=${S} setS=${setS} sim=${sim} adjust=${adjust} go=${go}/>`;
  else if (view === 'copenaghen') page = html`<${Cph} S=${S} sim=${sim} adjust=${adjust} go=${go}/>`;
  else if (view === 'timeline') page = html`<${Timeline} S=${S} setS=${setS} sim=${sim}/>`;
  else if (view === 'piano') page = html`<${Plan} S=${S} setS=${setS} resetAll=${resetAll}/>`;
  else page = html`<${Home} S=${S} E=${E} sim=${sim} go=${go} deposit=${deposit} setE=${setE}/>`;
  const exLeft = examApi(E).exams().length;
  const badge = { studio: exLeft + ' esami', giappone: Math.round(pct(S.japan, TARGET_J)) + '%', copenaghen: Math.round(pct(S.cph, TARGET_C)) + '%' };
  return html`
    <div className="app">
      <aside className="side">
        <p className="brand">Master Dashboard<small>${cap(fmtDate(now, { weekday: 'long', day: 'numeric', month: 'long' }))}</small></p>
        <nav className="snav" aria-label="Sezioni">
          ${NAV.map(n => html`<button key=${n[0]} type="button" aria-current=${view === n[0] ? 'page' : 'false'} onClick=${() => go(n[0])}>
            <i className="dot" style=${{ '--c': n[2] }}></i><span>${n[1]}</span>${badge[n[0]] ? html`<em>${badge[n[0]]}</em>` : null}</button>`)}
        </nav>
        <div className="side-foot"><p>Totale accantonato</p><b className="num">${eur(S.japan + S.cph)}</b></div>
      </aside>
      <main className="main">
        <div className="inner">
          <div className="mtop"><b>Master Dashboard</b><span>${eur(S.japan + S.cph)}</span></div>
          ${page}
        </div>
      </main>
      <nav className="tabs" aria-label="Sezioni"><div className="tabs-in">
        ${NAV.map(n => html`<button key=${n[0]} type="button" aria-current=${view === n[0] ? 'page' : 'false'} onClick=${() => go(n[0])}>
          <i className="dot" style=${{ '--c': n[2] }}></i><span>${n[1]}</span></button>`)}
      </div></nav>
    </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>

</body>
</html>
